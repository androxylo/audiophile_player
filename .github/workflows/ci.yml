name: CI Workspace & Verify Suite

on:
  workflow_dispatch:
  push:
    paths:
      - 'crates/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'crates/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

jobs:
  windows-verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run full workspace test suite with verify feature
        shell: pwsh
        run: |
          cargo test --workspace --locked --features verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check default (non-verify) workspace build
        shell: pwsh
        run: |
          cargo check --workspace --locked --exclude ap-verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload null-test YAML reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-null-test-reports
          path: target/null-test/*.yaml
          if-no-files-found: ignore
