name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach assets to (defaults to Cargo.toml version as vX.Y.Z)'
        required: false
        default: ''
      build_binary:
        description: 'Build and attach verified Windows x64 app zip + opt-in driver zip + SHA256SUMS + attestations'
        type: boolean
        required: false
        default: true

# Review #10 OD6 + OD8: least-privilege split — read-only build/test job with persist-credentials: false
# separated from the privileged publish-release job; all tag/ref inputs passed via env: (zero interpolation).
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      app_zip_name: ${{ steps.pkg.outputs.app_zip_name }}
      drv_zip_name: ${{ steps.pkg.outputs.drv_zip_name }}
      built_binaries: ${{ steps.pkg.outputs.built_binaries }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run workspace unit tests
        shell: pwsh
        run: |
          cargo test --release --workspace --locked

      - name: Determine release tag and version
        id: meta
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          $toml = Get-Content -LiteralPath Cargo.toml -Raw
          if ($toml -notmatch '(?m)^version\s*=\s*"([^"]+)"') { throw "Missing version in Cargo.toml" }
          $ver = $Matches[1]
          $tag = if ($env:REF_TYPE -eq "tag") { $env:REF_NAME }
                 elseif ($env:INPUT_TAG) { $env:INPUT_TAG.Trim() }
                 else { "v$ver" }
          if ($tag -notmatch '^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            throw "Invalid release tag format '$tag'"
          }
          if ($tag -match '^v(\d+\.\d+\.\d+)$' -and $Matches[1] -ne $ver) {
            throw "Release tag '$tag' does not match Cargo.toml version '$ver'"
          }
          # Review #10 OD8: refuse to clobber an existing tag pointing to a different commit!
          $existingRef = & git rev-parse -q --verify "refs/tags/$tag^{commit}" 2>$null
          if ($LASTEXITCODE -eq 0 -and $existingRef -and ($existingRef.Trim() -ne $env:HEAD_SHA)) {
            throw "Refusing to publish '$tag': existing tag points to $($existingRef.Trim()), not HEAD $($env:HEAD_SHA)"
          }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "version=$ver"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "tag=$tag"

      - name: Stage bootstrap.ps1 asset
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Force scripts\bootstrap.ps1 dist\bootstrap.ps1

      - name: Build verified Windows x64 app zip (no kernel driver) + opt-in Tidal driver zip
        id: pkg
        if: ${{ github.event_name == 'push' || inputs.build_binary }}
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts\package-release.ps1 -WithoutDriver
          if ($LASTEXITCODE -ne 0) { throw "App release packaging failed with $LASTEXITCODE" }

          powershell -ExecutionPolicy Bypass -File scripts\package-release.ps1 -DriverOnly -FetchWdk
          if ($LASTEXITCODE -ne 0) { throw "Driver release packaging failed with $LASTEXITCODE" }

          $appZip = Get-ChildItem dist\audiophile-player-v*-win-x64.zip | Where-Object { $_.Name -notmatch '-driver-' } | Select-Object -First 1
          $drvZip = Get-ChildItem dist\audiophile-player-driver-v*-win-x64.zip | Select-Object -First 1
          if (-not $appZip) { throw "App release zip missing in dist\" }
          if (-not $drvZip) { throw "Driver release zip missing in dist\" }

          $shaLines = New-Object System.Collections.Generic.List[string]
          foreach ($f in @($appZip, $drvZip, (Get-Item dist\bootstrap.ps1))) {
            $h = (Get-FileHash -Algorithm SHA256 -Path $f.FullName).Hash.ToLowerInvariant()
            $shaLines.Add("$h  $($f.Name)")
          }
          Set-Content -LiteralPath dist\SHA256SUMS -Value ($shaLines -join "`n") -Encoding ASCII

          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "app_zip_name=$($appZip.Name)"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "drv_zip_name=$($drvZip.Name)"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "built_binaries=true"

      - name: Upload packaged release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish-release:
    needs: build-and-test
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download packaged release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist

      - name: Attest build provenance
        if: ${{ needs.build-and-test.outputs.built_binaries == 'true' }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/${{ needs.build-and-test.outputs.app_zip_name }}
            dist/${{ needs.build-and-test.outputs.drv_zip_name }}
            dist/bootstrap.ps1

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REL_TAG: ${{ needs.build-and-test.outputs.tag }}
          REL_VER: ${{ needs.build-and-test.outputs.version }}
          APP_ZIP_NAME: ${{ needs.build-and-test.outputs.app_zip_name }}
          DRV_ZIP_NAME: ${{ needs.build-and-test.outputs.drv_zip_name }}
        run: |
          $tag = $env:REL_TAG
          $ver = $env:REL_VER
          $assets = @("dist\bootstrap.ps1")
          if (Test-Path "dist\SHA256SUMS") {
            $appPath = Join-Path "dist" $env:APP_ZIP_NAME
            $drvPath = Join-Path "dist" $env:DRV_ZIP_NAME
            $assets += @(
              "dist\SHA256SUMS",
              $appPath,
              ($appPath + ".sha256"),
              $drvPath,
              ($drvPath + ".sha256")
            )
          }

          $noteLines = @(
            "## Install (Windows 10/11 x64)",
            "",
            "**Recommended — build from source** (transparent, verifiable; download then run):",
            '```powershell',
            '$s = Join-Path $env:TEMP "audiophile-player-bootstrap.ps1"; irm https://github.com/androxylo/audiophile_player/releases/latest/download/bootstrap.ps1 -OutFile $s; powershell -ExecutionPolicy Bypass -File $s',
            '```',
            "",
            "**Opt-in verified prebuilt binary** (no compiler, no admin prompt, zero kernel `.sys` files):",
            '```powershell',
            '$s = Join-Path $env:TEMP "audiophile-player-bootstrap.ps1"; irm https://github.com/androxylo/audiophile_player/releases/latest/download/bootstrap.ps1 -OutFile $s; powershell -ExecutionPolicy Bypass -File $s -Binary',
            '```',
            "",
            "## Release Assets",
            "",
            "| Asset | Contents |",
            "|---|---|",
            "| ``bootstrap.ps1`` | Windows installer (builds from source by default; ``-Binary`` verifies SHA-256 + GitHub provenance attestation) |",
            "| ``audiophile-player-v$ver-win-x64.zip`` | Standalone Windows x64 player, docs, shortcuts, and third-party notices (no kernel driver) |",
            "| ``audiophile-player-driver-v$ver-win-x64.zip`` | **Opt-in** unsigned ACX 1.1 virtual render driver for Tidal Desktop Exclusive Mode (Windows 11 22H2+ x64 only; requires Secure Boot OFF + Test Mode ON — read [Getting Started](https://github.com/androxylo/audiophile_player/blob/$tag/docs/GETTING_STARTED.md#tidal-desktop-exclusive-mode-opt-in) first) |",
            "| ``SHA256SUMS`` | SHA-256 checksums for all downloadable assets (also individually attested via GitHub Build Provenance) |",
            "",
            "Verify provenance with GitHub CLI:",
            '```powershell',
            "gh attestation verify audiophile-player-v$ver-win-x64.zip -R androxylo/audiophile_player",
            '```',
            "",
            "Full setup guide: [Quick Start](https://github.com/androxylo/audiophile_player/blob/$tag/docs/QUICK_START.md) · [Getting Started](https://github.com/androxylo/audiophile_player/blob/$tag/docs/GETTING_STARTED.md) · [What's New](https://github.com/androxylo/audiophile_player/blob/$tag/docs/WHATS_NEW.md)"
          )
          $notesFile = "dist\RELEASE_NOTES.md"
          Set-Content -LiteralPath $notesFile -Value ($noteLines -join "`n") -Encoding UTF8

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber
            gh release edit $tag --title "Audiophile Player $tag" --notes-file $notesFile
          } else {
            gh release create $tag @assets --title "Audiophile Player $tag" --notes-file $notesFile
          }
