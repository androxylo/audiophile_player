[workspace]

[package]
name = "ap-exclusive-acx"
version = "0.1.0"
edition = "2024"
authors = ["androxylo"]
license = "GPL-3.0-or-later"
repository = "https://github.com/androxylo/audiophile_player"

[lib]
name = "ap_exclusive_audio"
crate-type = ["cdylib"]

[dependencies]
ap-stream-protocol = { path = "../../crates/ap-stream-protocol" }

[build-dependencies]
bindgen = "0.72.1"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = 2
lto = false
codegen-units = 1
