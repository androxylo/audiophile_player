# Audiophile Player — Pure-f64 8fS Windows Kernel-Streaming Rust Workspace

[workspace]
resolver = "2"
members = [
    "crates/ap-core",
    "crates/ap-stream-protocol",
    "crates/ap-source",
    "crates/ap-dsp",
    "crates/ap-output-win",
    "crates/ap-control",
    "crates/ap-upnp",
    "crates/ap-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["androxylo"]
license = "GPL-3.0-or-later"
repository = "https://github.com/androxylo/audiophile_player"

[workspace.dependencies]
ap-core = { path = "crates/ap-core" }
ap-stream-protocol = { path = "crates/ap-stream-protocol" }
ap-source = { path = "crates/ap-source" }
ap-dsp = { path = "crates/ap-dsp" }
ap-output-win = { path = "crates/ap-output-win" }
ap-control = { path = "crates/ap-control" }
ap-upnp = { path = "crates/ap-upnp" }

# Optimize third-party codec/DSP dependencies even in dev/test builds so
# decoding large 32-bit/384 kHz HiRes FLACs stays fast during `cargo test`.
[profile.dev.package."*"]
opt-level = 3
