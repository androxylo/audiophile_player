# Audiophile Player configuration file (example template)
#
# Copy this file to ONE of the following locations:
#   1. %APPDATA%\audiophile-player\config.toml   (recommended per-user Windows location)
#   2. .\audiophile-player.toml                  (portable, next to working directory)
#   3. Any path passed via: audiophile-player --config <PATH>
#
# Upsampling and noise shaping have strong automatic defaults; only room-specific
# REW stereo convolution needs to be configured here.

[convolution]
# Master switch. Omit this line to auto-enable whenever `dir`, `file`, or `file_*` is set.
# Set `enabled = false` explicitly to temporarily bypass convolution without deleting paths.
# enabled = true

# Option A: Folder containing rate-matched 2-channel REW WAV filters.
# Auto-picks the most recent 2-channel .wav by modification date matching the active
# 8fS rate (352800 Hz or 384000 Hz) and ignores mono .L / .R helper files.
# Tip: Use single quotes ('...') on Windows so backslashes do not need escaping.
# dir = 'C:\Program Files\EqualizerAPO\config'

# Option B: Explicit per-rate 2-channel WAV files (override `dir` for that rate).
# file_352800 = 'C:\path\to\room-352800.wav'
# file_384000 = 'C:\path\to\room-384000.wav'

# Option C: Single explicit 2-channel WAV file (used when its sample rate matches).
# file = 'C:\path\to\room-384000.wav'

[quantizer]
# Target DAC quantization bit depth on the 32-bit WDM-KS wire (allowed: 16, 18, 20, 24).
# Default is 24-bit with automatic clean-room 2nd-order gentle 8fS shaping (`ns-gentle-2`:
# -14.6 dB in-band @ 384 kHz, +6 dB max ultrasonic gain, minimal 1.21 LSB R-2R code activity;
# untouched native 8fS remains bit-perfect `bypass`, non-8fS falls back to `tpdf`).
# For R-2R NOS DAC experiments (e.g. Schiit Gungnir 2 / TI DAC8812 16-bit R-2R), you can also
# set dac_bits = 16, 18, or 20.
# dac_bits = 24
#
# Optional 8fS shaper override: 'auto' | 'bypass' | 'tpdf' | 'ns-gentle-2' |
# 'ns5' (clean-room ns5-class) | 'lns15' (clean-room lns15-class) | 'pggb-optimal' (wide40-9).
# Note: ns5, lns15, and pggb-optimal are independent clean-room Levinson-Durbin designs
# matching those order/passband/envelope classes (not proprietary copies).
# shaper = 'auto'

[upnp]
# Built-in UPnP AV MediaRenderer (for foobar2000 >= 2.25 play-to output & BubbleUPnP).
# Enabled by default; set `enabled = false` or pass `--no-upnp` to disable.
# enabled = true
# friendly_name = 'Audiophile Player'
# port = 49152
# bind_ip = '192.168.0.187'

[capture]
# Opt-in exclusive kernel stream capture (\\.\ApExclusiveAudio -> 'Line (Audiophile Player)'
# in Tidal Desktop Exclusive Mode, zero Windows mixer). Quietly parks when the optional ACX
# virtual render driver is not installed. Set `enabled = false` or pass `--no-capture` to disable.
# enabled = true

[ultimate]
# Showcase "best possible quality" playback mode (30 s bounded look-ahead, per-track
# content analysis H/A/L/B, full-tail REW convolution, exact-M fixed whole-track gain,
# mega-tap local filters, and learn-on-play YAML caching).
# Default is false (normal mode stays unchanged); can also be enabled via `--ultimate`.
# Note: streaming sources (UPnP/Tidal) never buffer beyond 30 s, never use mega-tap
# gauss-apod-4m, and always enforce -3 dB upsampling safety.
# enabled = false
# genre_rules = true
# learn_on_play = true

[filters]
# Schema-2 Filter Database (album-folder mirror under %APPDATA%\audiophile-player\filterdb)
# and user-owned overrides file (%APPDATA%\audiophile-player\my-filters.yaml).
# Your music library stays 100% read-only.
#
# mode:
#   'auto'      - use 'mine' whenever my-filters.yaml exists, else 'suggested' (default)
#   'mine'      - apply my-filters.yaml + AP_* FLAC tags, falling back to machine suggestions
#   'suggested' - ignore user overrides and play pure machine suggestions (for A/B comparison)
# mode = 'auto'
# dir = 'C:\Users\you\AppData\Roaming\audiophile-player\filterdb'
# choices_file = 'C:\Users\you\AppData\Roaming\audiophile-player\my-filters.yaml'

[filters.roots]
# Optional named music roots referenced as "main:Artist/Album" in my-filters.yaml.
# main = 'D:\Music'
# classical = 'E:\Classical'

[trackdb]
# Legacy Schema-1 YAML Track Database (kept for read-only fallback and opt-in --trackdb-sidecar).
# Run `audiophile-player filters migrate` to import existing Schema-1 entries into Schema 2.
# Default central location: %APPDATA%\audiophile-player\trackdb
# dir = 'C:\Users\you\AppData\Roaming\audiophile-player\trackdb'
# Set `sidecar = true` to write `<track.flac>.ap.yaml` next to local FLAC files instead.
# sidecar = false
