[package]
name = "ap-source"
description = "Audio sources ONLY: local FLAC library (recursive shuffle, RAM decode, ReplayGain tags) and Milestone 2 Tidal interface"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ap-core.workspace = true
ap-stream-protocol.workspace = true
flac-codec = "1.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
] }
