[package]
name = "ap-upnp"
description = "Pure-Rust UPnP AV MediaRenderer (SSDP, AVTransport:1, ConnectionManager:1, RenderingControl:1, GENA eventing) for foobar2000 and BubbleUPnP"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ap-core.workspace = true
ap-control.workspace = true
ap-source.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Networking_WinSock",
] }
