[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audiophile-poc"
version = "0.1.0"
description = "Zero-mixer Windows audio transport & DSP prototypes for audiophile_player"
authors = [{ name = "androxylo" }]
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "sounddevice>=0.5",
    "soundfile>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["audiophile_poc*"]

[tool.pytest.ini_options]
testpaths = ["../../tests/python"]
